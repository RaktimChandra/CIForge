[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ciforge"
version = "1.0.0"
description = "A small TeamCity-style CI orchestrator: YAML build configurations, build chains, artifact dependencies, VCS and schedule triggers, local and Docker runners."
readme = "README.md"
license = "MIT"
authors = [{ name = "Raktim Chandra" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "croniter>=6,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=7,<8", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML", "types-croniter"]

[project.scripts]
ciforge = "ciforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ciforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ciforge"]
mypy_path = "src"
